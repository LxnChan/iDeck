name: Build iDeck IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to fetch companion runtime assets & relink libraries'
        required: false
        default: 'v0.1.3-alpha.5'
        type: string
      bundle_id:
        description: 'Bundle Identifier for the app'
        required: false
        default: 'com.kuschqin.madeira.steamui'
        type: string
      build_number:
        description: 'Build number (CFBundleVersion, must be > 144 to upgrade over Build 144)'
        required: false
        default: '145'
        type: string
      configuration:
        description: 'Build configuration (Debug or Release)'
        required: false
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
      rebuild_fex:
        description: 'Rebuild FEXCore from source with CPUID patches'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
      - 'experiments/**'

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ] && [ -d "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE..."
            sudo xcode-select -s "$LATEST_XCODE"
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build tools (LLVM & Bison)
        run: |
          brew install llvm bison
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "Installed tools:"
          which llvm-objcopy || true
          which bison || true

      - name: Refresh bundled licenses
        run: |
          chmod +x build/stage-licenses.sh
          bash build/stage-licenses.sh

      - name: Stage companion runtime assets & native libraries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RELEASE_TAG="${{ inputs.release_tag || 'v0.1.3-alpha.5' }}"
          UPSTREAM_REPO="kuscholar/iDeck"
          DOWNLOAD_DIR="download_cache"
          mkdir -p "$DOWNLOAD_DIR"
          mkdir -p app/Madeira

          echo "==> Fetching companion relink libraries and base runtime assets..."

          # 1. Download relink archive containing prebuilt static libraries
          if ! gh release download "$RELEASE_TAG" --dir "$DOWNLOAD_DIR" --pattern "*relink*.tar.gz" 2>/dev/null; then
            echo "Attempting download from upstream $UPSTREAM_REPO..."
            gh release download "$RELEASE_TAG" --repo "$UPSTREAM_REPO" --dir "$DOWNLOAD_DIR" --pattern "*relink*.tar.gz" 2>/dev/null || \
            curl -fsSL -o "$DOWNLOAD_DIR/relink.tar.gz" "https://github.com/$UPSTREAM_REPO/releases/download/$RELEASE_TAG/iDeck-${RELEASE_TAG#v}-relink.tar.gz" 2>/dev/null || \
            curl -fsSL -o "$DOWNLOAD_DIR/relink.tar.gz" "https://github.com/$UPSTREAM_REPO/releases/download/v0.1.3-alpha.3/iDeck-0.1.3-alpha.3-relink.tar.gz" || true
          fi

          RELINK_TAR=$(find "$DOWNLOAD_DIR" -name "*relink*.tar.gz" -o -name "relink.tar.gz" | head -n 1)
          if [ -n "$RELINK_TAR" ] && [ -f "$RELINK_TAR" ]; then
            echo "Extracting static libraries from $RELINK_TAR..."
            mkdir -p /tmp/relink_extracted
            tar -xzf "$RELINK_TAR" -C /tmp/relink_extracted
            if [ -d "/tmp/relink_extracted/libraries" ]; then
              cp -vf /tmp/relink_extracted/libraries/*.a app/Madeira/ || true
            fi
          else
            echo "Warning: Relink archive not found; continuing with local libraries."
          fi

          # 2. Stage FEX build-ios library paths expected by Madeira.xcodeproj
          mkdir -p FEX/build-ios/FEXCore/Source
          mkdir -p FEX/build-ios/External/fmt
          mkdir -p FEX/build-ios/External/cephes
          mkdir -p FEX/build-ios/External/xxhash/cmake_unofficial
          mkdir -p FEX/build-ios/External/SoftFloat-3e

          [ -f "app/Madeira/libFEXCore.a" ] && cp -f app/Madeira/libFEXCore.a FEX/build-ios/FEXCore/Source/ || true
          [ -f "app/Madeira/libFEXCore_Base.a" ] && cp -f app/Madeira/libFEXCore_Base.a FEX/build-ios/FEXCore/Source/ || true
          [ -f "app/Madeira/libJemallocLibs.a" ] && cp -f app/Madeira/libJemallocLibs.a FEX/build-ios/FEXCore/Source/ || true
          [ -f "app/Madeira/libfmt.a" ] && cp -f app/Madeira/libfmt.a FEX/build-ios/External/fmt/ || true
          [ -f "app/Madeira/libcephes_128bit.a" ] && cp -f app/Madeira/libcephes_128bit.a FEX/build-ios/External/cephes/ || true
          [ -f "app/Madeira/libxxhash.a" ] && cp -f app/Madeira/libxxhash.a FEX/build-ios/External/xxhash/cmake_unofficial/ || true
          [ -f "app/Madeira/libsoftfloat_3e.a" ] && cp -f app/Madeira/libsoftfloat_3e.a FEX/build-ios/External/SoftFloat-3e/ || true

          # 3. Ensure base IPA components (prefix-template, StikJIT binary, libmetalirconverter, ideck-control)
          echo "==> Fetching base IPA for companion runtime binaries..."
          gh release download "$RELEASE_TAG" --dir "$DOWNLOAD_DIR" --pattern "*.ipa" 2>/dev/null || \
          gh release download "$RELEASE_TAG" --repo "$UPSTREAM_REPO" --dir "$DOWNLOAD_DIR" --pattern "*.ipa" 2>/dev/null || \
          curl -fsSL -o "$DOWNLOAD_DIR/base.ipa" "https://github.com/$UPSTREAM_REPO/releases/download/$RELEASE_TAG/iDeck.ipa" || true

          BASE_IPA=$(find "$DOWNLOAD_DIR" -name "*.ipa" -o -name "base.ipa" | head -n 1)
          if [ -n "$BASE_IPA" ] && [ -f "$BASE_IPA" ]; then
            echo "Extracting runtime components from $BASE_IPA..."
            mkdir -p /tmp/base_extract

            # Extract prefix-template.tar.gz
            unzip -q -o "$BASE_IPA" "Payload/Madeira.app/prefix-template.tar.gz" -d /tmp/base_extract 2>/dev/null || true
            if [ -f "/tmp/base_extract/Payload/Madeira.app/prefix-template.tar.gz" ]; then
              cp -vf "/tmp/base_extract/Payload/Madeira.app/prefix-template.tar.gz" "app/Madeira/prefix-template.tar.gz"
              echo "Successfully extracted prefix-template.tar.gz"
            fi

            # Extract StikJIT framework binary & Info.plist
            unzip -q -o "$BASE_IPA" "Payload/Madeira.app/Frameworks/StikJIT.framework/*" -d /tmp/base_extract 2>/dev/null || true
            if [ -f "/tmp/base_extract/Payload/Madeira.app/Frameworks/StikJIT.framework/StikJIT" ]; then
              mkdir -p "app/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework"
              cp -vf "/tmp/base_extract/Payload/Madeira.app/Frameworks/StikJIT.framework/StikJIT" "app/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework/StikJIT"
              chmod +x "app/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework/StikJIT"
              echo "Successfully staged StikJIT binary from $BASE_IPA"
            fi
            if [ -f "/tmp/base_extract/Payload/Madeira.app/Frameworks/StikJIT.framework/Info.plist" ]; then
              cp -vf "/tmp/base_extract/Payload/Madeira.app/Frameworks/StikJIT.framework/Info.plist" "app/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework/Info.plist"
              echo "Successfully staged StikJIT Info.plist from $BASE_IPA"
            fi

            # Extract libmetalirconverter.dylib if present
            unzip -q -o "$BASE_IPA" "Payload/Madeira.app/d3d12/libmetalirconverter.dylib" -d /tmp/base_extract 2>/dev/null || true
            if [ -f "/tmp/base_extract/Payload/Madeira.app/d3d12/libmetalirconverter.dylib" ]; then
              mkdir -p "app/Madeira/d3d12"
              cp -vf "/tmp/base_extract/Payload/Madeira.app/d3d12/libmetalirconverter.dylib" "app/Madeira/d3d12/libmetalirconverter.dylib"
              echo "Successfully extracted libmetalirconverter.dylib from $BASE_IPA"
            fi

            # Extract ideck-control.exe if present
            unzip -q -o "$BASE_IPA" "Payload/Madeira.app/ideck-control.exe" -d /tmp/base_extract 2>/dev/null || true
            if [ -f "/tmp/base_extract/Payload/Madeira.app/ideck-control.exe" ]; then
              mkdir -p "build/ideck-control"
              cp -vf "/tmp/base_extract/Payload/Madeira.app/ideck-control.exe" "build/ideck-control/ideck-control.exe"
              echo "Successfully extracted ideck-control.exe from $BASE_IPA"
            fi

            # Extract resource directories and PE runtimes (x86_64-vcruntime, aarch64-windows, etc.)
            for res_dir in "x86_64-vcruntime" "aarch64-windows" "arm64ec-windows" "i386-windows"; do
              unzip -q -o "$BASE_IPA" "Payload/Madeira.app/$res_dir/*" -d /tmp/base_extract 2>/dev/null || true
              mkdir -p "app/Madeira/$res_dir"
              if [ -d "/tmp/base_extract/Payload/Madeira.app/$res_dir" ]; then
                cp -vn /tmp/base_extract/Payload/Madeira.app/$res_dir/* "app/Madeira/$res_dir/" 2>/dev/null || true
                echo "Successfully staged $res_dir from $BASE_IPA"
              fi
            done
          fi

          # Ensure all expected resource directories exist on disk for Xcode copy phases
          mkdir -p app/Madeira/x86_64-vcruntime \
                   app/Madeira/aarch64-windows \
                   app/Madeira/arm64ec-windows \
                   app/Madeira/i386-windows \
                   app/Madeira/d3d12 \
                   app/Madeira/nls \
                   app/Madeira/legal \
                   app/Madeira/licenses

          # Fallback for StikJIT binary from upstream StikDebug/StikJIT release
          if [ ! -f "app/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework/StikJIT" ]; then
            echo "Fetching StikJIT from upstream StikDebug/StikJIT release 1.9.0..."
            curl -fsSL -o "$DOWNLOAD_DIR/StikJIT.xcframework.zip" "https://github.com/StikDebug/StikJIT/releases/download/1.9.0/StikJIT.xcframework.zip" 2>/dev/null || true
            if [ -f "$DOWNLOAD_DIR/StikJIT.xcframework.zip" ]; then
              mkdir -p /tmp/stikjit_extracted
              unzip -q -o "$DOWNLOAD_DIR/StikJIT.xcframework.zip" -d /tmp/stikjit_extracted
              STIK_BIN=$(find /tmp/stikjit_extracted -name "StikJIT" -type f | grep "ios-arm64" | head -n 1)
              if [ -n "$STIK_BIN" ]; then
                mkdir -p "app/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework"
                cp -vf "$STIK_BIN" "app/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework/StikJIT"
                chmod +x "app/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework/StikJIT"
                echo "Successfully staged StikJIT binary from official release"
              fi
            fi
          fi

          # Fallback if prefix-template.tar.gz could not be downloaded
          if [ ! -f "app/Madeira/prefix-template.tar.gz" ]; then
            echo "Warning: Creating fallback empty prefix-template.tar.gz..."
            mkdir -p /tmp/fallback_pfx
            tar -czf app/Madeira/prefix-template.tar.gz -C /tmp/fallback_pfx .
          fi

          echo "Staging complete. Libraries present in app/Madeira:"
          ls -lh app/Madeira/*.a || true

      - name: Rebuild FEXCore (optional)
        if: ${{ inputs.rebuild_fex == true }}
        run: |
          chmod +x build/fex-ios/build.sh
          echo "==> Rebuilding FEXCore with CPUID patch from source..."
          bash build/fex-ios/build.sh
          cp -vf FEX/build-ios/FEXCore/Source/libFEXCore*.a app/Madeira/ || true

      - name: Setup FEXCore generated headers
        run: |
          chmod +x build/setup-fex-headers.sh
          bash build/setup-fex-headers.sh

      - name: Setup Wine host headers
        run: |
          chmod +x build/setup-wine-headers.sh
          bash build/setup-wine-headers.sh

      - name: Rebuild modified Wine runtime libraries
        run: |
          chmod +x build/wineserver/build.sh build/ntdll-unix/compile_patched.sh build/win32u-unix/compile_patched.sh
          echo "==> Rebuilding libwineserver.a with modified source..."
          bash build/wineserver/build.sh
          echo "==> Rebuilding libntdll_unix.a with modified source..."
          bash build/ntdll-unix/compile_patched.sh
          echo "==> Rebuilding libwin32u_unix.a with modified source..."
          bash build/win32u-unix/compile_patched.sh

      - name: Build application with xcodebuild
        run: |
          set -e
          CONFIG="${{ inputs.configuration || 'Debug' }}"
          BUNDLE_ID="${{ inputs.bundle_id || 'com.kuschqin.madeira.steamui' }}"
          BUILD_NUMBER="${{ inputs.build_number || '146' }}"

          echo "==> Building Madeira with configuration=$CONFIG, bundle_id=$BUNDLE_ID, build_number=$BUILD_NUMBER"
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira \
            -configuration "$CONFIG" -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MADEIRA_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            build

          APP_PLIST="build/DerivedData/Build/Products/$CONFIG-iphoneos/Madeira.app/Info.plist"
          HELPER_PLIST="build/DerivedData/Build/Products/$CONFIG-iphoneos/Madeira.app/PlugIns/MadeiraJITHelper.appex/Info.plist"
          FRAMEWORK_PLIST="build/DerivedData/Build/Products/$CONFIG-iphoneos/Madeira.app/Frameworks/StikJIT.framework/Info.plist"
          if [ -f "$APP_PLIST" ] && [ -f "$HELPER_PLIST" ]; then
            APP_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PLIST")
            HELPER_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$HELPER_PLIST")
            APP_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PLIST")
            echo "Main app Bundle ID: $APP_ID, Version: $APP_VER"
            echo "JIT Helper Bundle ID: $HELPER_ID"
            if [ "$APP_ID" = "$HELPER_ID" ] || [[ "$HELPER_ID" != "$APP_ID."* ]]; then
              echo "Fixing JIT Helper Bundle ID to have '$APP_ID.JITHelper'..."
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $APP_ID.JITHelper" "$HELPER_PLIST"
              echo "Updated JIT Helper Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$HELPER_PLIST")"
            fi
            # Ensure helper also has matching CFBundleVersion
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$HELPER_PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$HELPER_PLIST"
          fi
          if [ -f "$FRAMEWORK_PLIST" ]; then
            FW_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$FRAMEWORK_PLIST" 2>/dev/null || echo "unknown")
            FW_MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$FRAMEWORK_PLIST" 2>/dev/null || echo "unknown")
            echo "StikJIT.framework Bundle ID: $FW_ID, MinimumOSVersion: $FW_MIN_OS"
          fi

      - name: Package IPA
        id: package
        run: |
          set -e
          CONFIG="${{ inputs.configuration || 'Debug' }}"
          OUTPUT_DIR="output"
          mkdir -p "$OUTPUT_DIR"

          SHORT_SHA=$(git rev-parse --short HEAD)
          IPA_NAME="iDeck-fork-${SHORT_SHA}.ipa"
          IPA_PATH="$OUTPUT_DIR/$IPA_NAME"
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "ipa_name=$IPA_NAME" >> $GITHUB_OUTPUT

          APP_PATH=$(find build/DerivedData -name "Madeira.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: Could not locate built Madeira.app under build/DerivedData"
            exit 1
          fi
          echo "Found built application at: $APP_PATH"
          rm -f "$IPA_PATH"

          if python3 tools/package-ipa.py "$APP_PATH" "$IPA_PATH" --entitlements app/Madeira/Madeira.entitlements; then
            echo "Package complete with tools/package-ipa.py -> $IPA_NAME"
          else
            echo "tools/package-ipa.py returned non-zero, using fallback packaging..."
            PAYLOAD_DIR="/tmp/manual_ipa_payload"
            rm -rf "$PAYLOAD_DIR"
            mkdir -p "$PAYLOAD_DIR/Payload"
            cp -R "$APP_PATH" "$PAYLOAD_DIR/Payload/"
            (cd "$PAYLOAD_DIR" && zip -r -9 "$GITHUB_WORKSPACE/$IPA_PATH" Payload)
          fi

          echo "IPA package generated successfully:"
          ls -lh "$OUTPUT_DIR"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iDeck-fork-${{ steps.package.outputs.short_sha }}
          path: |
            output/*.ipa
            output/*.inventory.json
          retention-days: 14
          if-no-files-found: error
